name: Release

# Релиз создаётся тегом, совпадающим с KIT_VERSION в src/install.template.sh:
#   git tag v1.1 && git push origin v1.1
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0        # нужны все теги и история для ссылки сравнения

      - name: Проверки
        run: |
          python3 src/build.py /tmp/install-vpn-kit.sh
          if ! cmp -s /tmp/install-vpn-kit.sh install-vpn-kit.sh; then
            echo "::error::install-vpn-kit.sh не пересобран из src/"; exit 1
          fi
          ver=$(sed -n 's/^KIT_VERSION="\(.*\)"$/\1/p' install-vpn-kit.sh)
          # Предрелиз: тег с дефисом (например v1.4.0-rc1) — не становится latest,
          # пользователи его не получают; строгую сверку версии для него не делаем.
          case "$GITHUB_REF_NAME" in
            *-*) echo "PRERELEASE=--prerelease" >> "$GITHUB_ENV" ;;
            *)   if [ "v$ver" != "$GITHUB_REF_NAME" ]; then
                   echo "::error::KIT_VERSION=$ver не совпадает с тегом $GITHUB_REF_NAME"; exit 1
                 fi ;;
          esac
          shellcheck -s bash install-vpn-kit.sh canary/install-canary.sh
          python3 -m unittest discover -s tests

      - name: Контрольная сумма
        run: sha256sum install-vpn-kit.sh > install-vpn-kit.sh.sha256

      - name: Заметки о релизе из CHANGELOG.md
        run: |
          base="${GITHUB_REF_NAME%%-*}"                 # v1.4.0-rc1 -> v1.4.0 ; v1.4 -> v1.4
          sec() { awk -v v="$1" '$1=="##" && $2==v {g=1; next} $1=="##" {g=0} g' CHANGELOG.md; }
          notes="$(sec "$base")"
          [ -n "$notes" ] || notes="$(sec "${base%.0}")"  # запасной вариант без хвостового .0
          prev="$(git tag -l 'v*' --sort=-v:refname | grep -vxF "$GITHUB_REF_NAME" | head -n1)"
          {
            [ -n "$notes" ] && printf '%s\n' "$notes"
            [ -n "$prev" ] && printf '\n**Full Changelog**: https://github.com/%s/compare/%s...%s\n' \
              "$GITHUB_REPOSITORY" "$prev" "$GITHUB_REF_NAME"
          } > /tmp/notes.md
          echo "HAVE_NOTES=$([ -n "$notes" ] && echo 1 || echo 0)" >> "$GITHUB_ENV"

      - name: Релиз на GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$HAVE_NOTES" = 1 ]; then NOTE_ARGS=(--notes-file /tmp/notes.md); else NOTE_ARGS=(--generate-notes); fi
          gh release create "$GITHUB_REF_NAME" \
            install-vpn-kit.sh install-vpn-kit.sh.sha256 \
            canary/install-canary.sh canary/vpn-canary.py \
            --title "Amnezia Server Kit $GITHUB_REF_NAME" --verify-tag "${NOTE_ARGS[@]}" $PRERELEASE
